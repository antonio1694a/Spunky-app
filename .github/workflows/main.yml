name: Build Android APK with One UI Widget

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Project & APK
        run: |
          echo "==== Repository Directory Contents ===="
          ls -la

          # If the user uploaded files inside a nested folder (e.g. spunky-sun-chasing-full-project/)
          NESTED_PKG=$(find . -maxdepth 2 -name "package.json" | head -n 1)
          if [ -n "$NESTED_PKG" ] && [ "$NESTED_PKG" != "./package.json" ]; then
            NESTED_DIR=$(dirname "$NESTED_PKG")
            echo "Moving files from nested directory $NESTED_DIR to root..."
            cp -rn "$NESTED_DIR"/* . || true
            cp -rn "$NESTED_DIR"/.* . 2>/dev/null || true
          fi

          # If android directory does not exist, build web app and generate it
          if [ ! -d "android" ]; then
            echo "==> Android folder not found in repo. Building web assets and generating Android project..."
            npm install --legacy-peer-deps
            npm run build
            npx cap add android || true
            npx cap sync android
          fi

          # Ensure native widget and icons are injected
          echo "==> Injecting One UI Widget and resources..."
          mkdir -p android/app/src/main/java/com/spunkysun/chasing
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/xml

          if [ -d "android-native" ]; then
            cp android-native/SolisWidgetProvider.kt android/app/src/main/java/com/spunkysun/chasing/ 2>/dev/null || true
            cp android-native/widget_layout_4x2.xml android/app/src/main/res/layout/ 2>/dev/null || true
            cp android-native/widget_bg_oneui.xml android/app/src/main/res/drawable/ 2>/dev/null || true
            cp android-native/widget_info_4x2.xml android/app/src/main/res/xml/ 2>/dev/null || true
          fi

          # Find gradlew
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            GRADLE_DIR=$(dirname "$GRADLEW_PATH")
            echo "==> Compiling in $GRADLE_DIR with Gradle Wrapper..."
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "==> Compiling with System Gradle..."
            cd android
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: SpunkySunChasing-OneUI-Widget-APK
          path: '**/build/outputs/apk/debug/*.apk'
